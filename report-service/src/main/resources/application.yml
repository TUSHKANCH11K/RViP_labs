server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: report-service
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/reports/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    ru.rvip.report: INFO
