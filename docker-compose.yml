services:
  db:
    image: postgres:16
    container_name: rvip-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-contracts}
      POSTGRES_USER: ${DB_USER:-contracts}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-contracts}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - rvip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - rvip-net

  contract-service:
    build:
      context: .
      dockerfile: contract-service/Dockerfile
    container_name: rvip-contract-service
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-contracts}
      DB_USER: ${DB_USER:-contracts}
      DB_PASSWORD: ${DB_PASSWORD:-contracts}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - rvip-net

volumes:
  rvip-pgdata:

networks:
  rvip-net:
    name: rvip-net
