server:
  port: 8080

app:
  contract-service-url: ${CONTRACT_SERVICE_URL:http://localhost:8081}
  report-service-url: ${REPORT_SERVICE_URL:http://localhost:8082}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 10s
      routes:
        - id: contract-service
          uri: ${app.contract-service-url}
          predicates:
            - Path=/api/contracts/**
        - id: report-service
          uri: ${app.report-service-url}
          predicates:
            - Path=/api/reports/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls-primary-name: contract-service
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: contract-service
        url: /api/contracts/v3/api-docs
      - name: report-service
        url: /api/reports/v3/api-docs

logging:
  level:
    ru.rvip.gateway: INFO
